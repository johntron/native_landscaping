# Native landscaping app + its own Cloudflare Tunnel connector.
#
# TUNNEL ISOLATION (the thing this file is careful about): every compose
# project that wants a public hostname runs its OWN `cloudflared` sidecar,
# holding its OWN tunnel token. Nothing here is shared with the geneology
# project's tunnel, and nothing needs to be:
#
#   * Each sidecar is a normal compose service — no `network_mode: host`, no
#     published ports, no `container_name`. It gets its own network namespace,
#     so cloudflared's metrics listener binds INSIDE the container and two
#     connectors on this host have no port to fight over.
#   * Token mode is outbound-only. The connector dials Cloudflare's edge; it
#     never listens on the host, so there is no host port to collide on.
#   * The token embeds the tunnel ID, so one token == one tunnel. THIS is
#     where "the second tunnel binds to the one I already spawned" actually
#     comes from: two connectors running the SAME token. Cloudflare treats the
#     second as another replica of the FIRST tunnel — it registers happily,
#     serves the first tunnel's ingress, and the new hostname gets Error 1033
#     because its own tunnel has no connector. Meanwhile the old project's
#     traffic starts load-balancing onto a connector that can't reach its
#     origin.
#
#     Observed here 2026-08-18, and the cause is a trap worth knowing: `$VAR`
#     in a compose file is interpolated by COMPOSE, and a variable exported in
#     the SHELL BEATS the project's .env file. A stray CLOUDFLARE_TUNNEL_TOKEN
#     in the environment (geneology's) silently won over this project's .env,
#     so this sidecar booted geneology's tunnel — same host, same image, wrong
#     tunnel. The fix is below: pass the token via `env_file` as TUNNEL_TOKEN,
#     which cloudflared reads natively. env_file values come from the file
#     only — the host shell cannot override them.
#
#   * Metrics: both connectors log "Starting metrics server on [::]:20241" and
#     run concurrently without conflict — separate netns, verified 2026-08-18.
#
# `web` is the service name the Cloudflare dashboard's Public Hostname entry
# points at (`http://web:8080`). That name is resolved by Docker's DNS on this
# project's compose network, so RENAMING THIS SERVICE BREAKS THE TUNNEL unless
# the dashboard route is changed to match.
#
# WHAT RUNS IN PRODUCTION (nl-3s5.12): not this working tree. `web` and
# `feed-poller` mount a separate git worktree, detached at a commit of main, at
# /app. tools/deploy.sh moves that worktree to main's tip and restarts them,
# and the hooks in .githooks/ run it after every commit or merge on main.
# Editing a file here changes nothing live until it is committed to main.
#
# ALWAYS RUN COMPOSE FROM THIS DIRECTORY (or with -f <this file>
# --project-directory <this dir>), never from the deploy worktree. The project
# is pinned by `name:` below, but relative paths (`.`, `./data`, the build
# context, .env) resolve against the project directory, so running compose
# from the deploy worktree would point every one of them somewhere else.
name: native_landscaping

x-app: &app
  build:
    context: .
    dockerfile_inline: |
      FROM node:22.23.2-slim
      # Deps install at / rather than /app on purpose: the bind mount below
      # covers /app, which would shadow an /app/node_modules baked into the
      # image. Node's resolver walks parent directories, so /node_modules is
      # found from /app and survives the mount.
      WORKDIR /
      COPY package.json package-lock.json ./
      RUN npm ci --omit=dev
      WORKDIR /app
      CMD ["node", "server.js"]
  volumes:
    # The code: the deploy worktree, a sibling of this tree, which
    # tools/deploy.sh creates and moves. Override with DEPLOY_DIR in the
    # environment. It must start with `/` or `.`: in short bind syntax a bare
    # name is a NAMED VOLUME, not a path. It must exist before `up`, or Docker
    # creates an empty root-owned directory there and serves nothing.
    - ${DEPLOY_DIR:-../native_landscaping-deploy}:/app
    # Everything the app WRITES at runtime is mounted over it from THIS tree,
    # so user data stays exactly where it lived before the split, and the
    # deploy worktree is never written to (a dirty worktree would make the next
    # `git checkout --detach` fail, or strand what a person entered):
    #   data/      every SQLite db (app.db holds every yard since nl-3s5.3),
    #              the yard photos under data/projects/<id>/img/, the
    #              gitignored saved-areas.export.json, and backup-status.json,
    #              written by the host's nightly backup timer (nl-3s5.13,
    #              tools/backup/), which reads app.db and the photos from this
    #              same host directory, not through a container
    #   catalog/   manual-corrections.tsv, appended by /api/claims-correct
    # Directories, not single files: the app writes temp-then-rename, and a
    # rename onto a single-file bind mount fails with EBUSY.
    #
    # projects/ is NOT mounted (nl-3s5.28). It was mounted only for the
    # one-time tools/import-projects.mjs, which read the yards under this
    # tree's projects/ and copied them into app.db (nl-3s5.3); that import
    # is done and verified (app_meta records it), and nothing under
    # projects/ is written or served at runtime since. /app/projects is now
    # just the deploy tree's own tracked seed (projects/backyard), which
    # nothing serves either.
    - ./data:/app/data
    - ./catalog:/app/catalog
    # server/static.js serves node_modules/jszip/dist/jszip.min.js (the HOA
    # packet export) from /app, and the deploy worktree has no node_modules.
    # Only jszip is mounted: the server's own imports still fall through to the
    # image's /node_modules.
    - ./node_modules/jszip:/app/node_modules/jszip:ro
  restart: unless-stopped

services:
  web:
    <<: *app
    environment:
      # server.js defaults to 8000; the tunnel route expects 8080. It calls
      # server.listen(PORT) with no host arg, so it binds all interfaces and
      # the sidecar can reach it over the compose network.
      PORT: "8080"
      # The Setup panel tells a user when nearby species will appear (nl-3s5.30),
      # so web reads the same poll interval feed-poller runs on.
      FEED_POLL_INTERVAL_MINUTES: ${FEED_POLL_INTERVAL_MINUTES:-30}
      # Seeds the first admin in data/app.db (server/db/appDb.js). Interpolated
      # from the gitignored .env: this repo is public, so the address never
      # appears in a tracked file. Unset seeds nothing.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Verify the Cloudflare Access JWT on every request (server/identity.js).
      # Also from .env. Either one unset means every request is anonymous.
      # Never set DEV_USER_EMAIL here: it is for local dev and e2e only.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Hosts a state-changing request's Origin may name (nl-3s5.16,
      # rejectCrossSite in server/http.js). Explicit rather than trusting the
      # Host header, which the tunnel's ingress settings could rewrite. The
      # loopback entries keep writes working from http://127.0.0.1:8080.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-native-landscaping.johntron.com,127.0.0.1:8080,localhost:8080}
    # Loopback ONLY. Off-box reach comes solely through the Cloudflare Tunnel
    # + Access gate, same as geneology's `review` service. A bare "8080:8080"
    # binds 0.0.0.0 and would serve the app to the whole LAN with no Google
    # SSO in front of it — defeating the point of the Access policy.
    ports:
      - "127.0.0.1:8080:8080"

  # Polls every saved area (the saved_areas table in data/app.db, read through
  # tools/savedAreas/savedAreasDb.js) against iNaturalist on a timer
  # (tools/schedule-feed-poll.mjs), so the observation feed (nl-1qy) fills in
  # without anyone remembering to run tools/fetch-observation-events.mjs by
  # hand. It writes the events to data/observation-events.db. Same image and
  # mounts as `web` (via the &app anchor), so it opens the same app.db over the
  # same host directory, without migrating it (openAppDbWithoutMigrating):
  # SQLite's WAL mode allows two processes on one file.
  # No published port: this service makes only outbound calls to iNaturalist,
  # nothing listens.
  feed-poller:
    <<: *app
    command: ["node", "tools/schedule-feed-poll.mjs"]
    environment:
      FEED_POLL_INTERVAL_MINUTES: ${FEED_POLL_INTERVAL_MINUTES:-30}

  cloudflared:
    image: cloudflare/cloudflared:latest
    # TUNNEL_TOKEN comes from .env (gitignored — it is a credential) and is
    # read by cloudflared itself. Deliberately NOT "--token ${VAR}": that form
    # is interpolated by compose, where a shell variable of the same name
    # BEATS this project's .env and boots the wrong tunnel. See the header.
    env_file:
      - .env
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    # Ordering only, not readiness — cloudflared may log a few origin
    # connection errors before `web` finishes booting. Those self-heal.
    depends_on:
      - web
